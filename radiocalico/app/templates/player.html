<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width, initial-scale=1"><title>Radio Calico - Stream Player</title><link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400&display=swap" rel=stylesheet><link rel=stylesheet href="{{ url_for('static', filename='player.css') }}"></head><body><div class=header><h1><div class=header-logo><img src="{{ url_for('static', filename='radiocalico_logo.png') }}" alt="Radio Calico Logo"></div> Radio Calico </h1></div><div class=container><div class=now-playing><div class=album-cover id=albumCover><svg xmlns=http://www.w3.org/2000/svg viewbox="0 0 400 400" width=400 height=400><rect width=400 height=400 fill=#38A29D /><text x=200 y=200 font-size=48 fill=white text-anchor=middle dominant-baseline=middle>Loading...</text></svg></div><div class=track-info><div class=track-artist id=trackArtist>Loading...</div><div class=track-title id=trackTitle></div><div class=track-album id=trackAlbum></div><div class=track-specs id=trackSpecs></div><div class=rating-label>Rate this track:</div><div class=rating-section id=ratingSection style=display:none;><button class=rating-button id=thumbsUpBtn onclick=rateTrack(true)> 👍 <span class=rating-count id=thumbsUpCount>0</span></button><button class=rating-button id=thumbsDownBtn onclick=rateTrack(false)> 👎 <span class=rating-count id=thumbsDownCount>0</span></button></div><div class=player-wrapper><button class=player-button id=playBtn onclick=togglePlay()>▶️</button><div class=player-time><span id=currentTime>0:00</span> / Live</div><div class=player-volume><span class=player-volume-icon>🔊</span><input type=range min=0 max=100 value=100 id=volumeControl onchange=setVolume(this.value)></div></div></div></div><div class=recently-played><h2>Previous tracks:</h2><div id=recentlyPlayedContent class=loading>Loading...</div></div></div><audio id=audioPlayer preload=auto></audio><script src=https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js></script><script>
    const STREAM_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/hls/live.m3u8';
    const METADATA_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/metadatav2.json';
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const currentTimeDisplay = document.getElementById('currentTime');
    const volumeControl = document.getElementById('volumeControl');
    const trackArtist = document.getElementById('trackArtist');
    const trackTitle = document.getElementById('trackTitle');
    const trackAlbum = document.getElementById('trackAlbum');
    const trackSpecs = document.getElementById('trackSpecs');
    const recentlyPlayedContent = document.getElementById('recentlyPlayedContent');
    const ratingSection = document.getElementById('ratingSection');
    const thumbsUpBtn = document.getElementById('thumbsUpBtn');
    const thumbsDownBtn = document.getElementById('thumbsDownBtn');
    const thumbsUpCount = document.getElementById('thumbsUpCount');
    const thumbsDownCount = document.getElementById('thumbsDownCount');

    let currentSongId = null;
    let isPlaying = false;
    let metadataInterval = null;

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        playBtn.textContent = '▶️';
        clearInterval(metadataInterval);
      } else {
        audio.play();
        playBtn.textContent = '⏸️';
        metadataInterval = setInterval(fetchMetadata, 30000);
      }
      isPlaying = !isPlaying;
    }

    function setVolume(value) {
      audio.volume = value / 100;
    }

    function updateTimeDisplay() {
      if (audio.currentTime) {
        const minutes = Math.floor(audio.currentTime / 60);
        const seconds = Math.floor(audio.currentTime % 60);
        currentTimeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
      }
    }

    function initStream() {
      if (Hls.isSupported()) {
        const hls = new Hls({
          autoStartLoad: true,
          debug: false,
          fragLoadingTimeOut: 20000,
          manifestLoadingTimeOut: 10000,
          levelLoadingTimeOut: 10000,
        });

        hls.loadSource(STREAM_URL);
        hls.attachMedia(audio);

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.error('HLS fatal error:', data.type);
            hls.destroy();
          }
        });
      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        audio.src = STREAM_URL;
      }
    }

    function getDefaultStreamQuality() {
      if (navigator.connection && navigator.connection.effectiveType) {
        const connectionType = navigator.connection.effectiveType;
        if (connectionType === '4g' || connectionType === '5g') {
          return '48 kHz FLAC/HLS Lossless';
        } else if (connectionType === '3g') {
          return '192 kbps VBR mp3';
        }
      }
      return '48 kHz FLAC/HLS Lossless';
    }

    function hashStringToColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash = hash & hash;
      }
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue}, 70%, 60%)`;
    }

    function formatMetadata(data) {
      trackArtist.textContent = data.artist;
      trackTitle.textContent = data.title + ' (' + data.date + ')';
      trackAlbum.textContent = data.album;
      const streamQuality = data.stream_quality || getDefaultStreamQuality();
      trackSpecs.innerHTML = `Source quality: ${data.bit_depth}-bit ${data.sample_rate / 1000}kHz<br>Stream quality: ${streamQuality}`;

      const color1 = hashStringToColor(data.artist);
      const color2 = hashStringToColor(data.album);
      const albumCover = document.getElementById('albumCover');
      const shortArtist = data.artist.substring(0, 20);
      const shortAlbum = data.album.substring(0, 30);

      albumCover.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:${color1};stop-opacity:1" />
              <stop offset="100%" style="stop-color:${color2};stop-opacity:1" />
            </linearGradient>
          </defs>
          <rect width="400" height="400" fill="url(#grad)"/>
          <text x="200" y="150" font-size="32" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">${shortArtist}</text>
          <text x="200" y="250" font-size="24" fill="rgba(255,255,255,0.8)" text-anchor="middle" dominant-baseline="middle">${shortAlbum}</text>
        </svg>
      `;

      fetchSongRatings(data.title, data.artist, data.album, data.date);

      const recentTracks = [];
      for (let i = 1; i <= 5; i++) {
        const artistKey = `prev_artist_${i}`;
        const titleKey = `prev_title_${i}`;
        if (data[artistKey] && data[titleKey]) {
          recentTracks.push(`
            <div class="track-item">
              <div class="track-item-title">${data[artistKey]}: ${data[titleKey]}</div>
            </div>
          `);
        }
      }
      recentlyPlayedContent.innerHTML = recentTracks.join('');
    }

    function fetchSongRatings(title, artist, album, date) {
      const params = new URLSearchParams({
        title: title,
        artist: artist,
        album: album,
        date: date
      });

      fetch(`/api/song/current?${params}`)
        .then(response => response.json())
        .then(data => {
          currentSongId = data.id;
          thumbsUpCount.textContent = data.thumbs_up;
          thumbsDownCount.textContent = data.thumbs_down;
          ratingSection.style.display = 'flex';

          thumbsUpBtn.classList.remove('active');
          thumbsDownBtn.classList.remove('active');

          if (data.user_rating === 'up') {
            thumbsUpBtn.classList.add('active');
          } else if (data.user_rating === 'down') {
            thumbsDownBtn.classList.add('active');
          }
        })
        .catch(error => console.error('Error fetching song ratings:', error));
    }

    function rateTrack(isThumbsUp) {
      if (!currentSongId) return;

      fetch('/api/song/rate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          song_id: currentSongId,
          is_thumbs_up: isThumbsUp
        })
      })
        .then(response => response.json())
        .then(data => {
          thumbsUpCount.textContent = data.thumbs_up;
          thumbsDownCount.textContent = data.thumbs_down;
          thumbsUpBtn.classList.toggle('active', data.user_rating === 'up');
          thumbsDownBtn.classList.toggle('active', data.user_rating === 'down');
        })
        .catch(error => console.error('Error submitting rating:', error));
    }

    function fetchMetadata() {
      const cached = localStorage.getItem('radiocalico-metadata');
      const lastUpdate = parseInt(localStorage.getItem('radiocalico-metadata-time') || '0', 10);
      const now = Date.now();
      const cacheExpiry = 30000;

      if (cached && (now - lastUpdate) < cacheExpiry) {
        formatMetadata(JSON.parse(cached));
        return;
      }

      fetch(METADATA_URL)
        .then(response => response.json())
        .then(data => {
          localStorage.setItem('radiocalico-metadata', JSON.stringify(data));
          localStorage.setItem('radiocalico-metadata-time', now.toString());
          formatMetadata(data);
        })
        .catch(error => {
          console.error('Error fetching metadata:', error);
          trackArtist.textContent = 'Unable to load';
          recentlyPlayedContent.innerHTML = '<div class="loading">Unable to load metadata</div>';
        });
    }

    audio.addEventListener('timeupdate', updateTimeDisplay);

    document.addEventListener('DOMContentLoaded', () => {
      initStream();
      fetchMetadata();
      volumeControl.value = 100;
      setVolume(100);
    });
  </script></body></html>
