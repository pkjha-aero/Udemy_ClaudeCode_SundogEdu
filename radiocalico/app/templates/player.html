<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Calico - Stream Player</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #FFFFFF;
      color: #231F20;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }
    .header {
      background: #38A29D;
      color: #FFFFFF;
      padding: 24px 20px;
      text-align: center;
    }
    .header h1 {
      font-family: "Montserrat", sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .header-logo {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .container {
      flex: 1;
      padding: 64px 24px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .now-playing {
      background: transparent;
      border-radius: 4px;
      padding: 48px;
      margin-bottom: 48px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
    }
    .album-cover {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      background: #FFFFFF;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .album-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .track-info {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .track-artist {
      font-family: "Montserrat", sans-serif;
      font-size: 48px;
      font-weight: 700;
      color: #1F4E23;
      margin-bottom: 20px;
      line-height: 1.2;
    }
    .track-title {
      font-family: "Montserrat", sans-serif;
      font-size: 24px;
      font-weight: 600;
      color: #231F20;
      margin-bottom: 12px;
    }
    .track-album {
      font-size: 16px;
      color: #231F20;
      margin-bottom: 24px;
    }
    .track-specs {
      font-size: 14px;
      color: #231F20;
      font-style: italic;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .rating-label {
      font-family: "Montserrat", sans-serif;
      font-size: 16px;
      color: #1F4E23;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .rating-section {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }
    .rating-button {
      background: none;
      border: 2px solid #CCC;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #231F20;
    }
    #thumbsUpBtn:hover {
      border-color: #1F4E23;
      color: #1F4E23;
    }
    #thumbsDownBtn:hover {
      border-color: #EFA63C;
      color: #EFA63C;
    }
    #thumbsUpBtn.active {
      background: #1F4E23;
      border-color: #1F4E23;
      color: #FFFFFF;
    }
    #thumbsDownBtn.active {
      background: #EFA63C;
      border-color: #EFA63C;
      color: #231F20;
    }
    .rating-count {
      font-size: 12px;
      font-weight: 600;
      color: #999;
    }
    .rating-button.active .rating-count {
      color: inherit;
    }
    .player-wrapper {
      background: #38A29D;
      border-radius: 4px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .player-button {
      background: none;
      border: none;
      color: #FFFFFF;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .player-button:hover {
      opacity: 0.8;
    }
    .player-time {
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 500;
      min-width: 80px;
    }
    .player-volume {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .player-volume-icon {
      color: #FFFFFF;
      font-size: 18px;
    }
    .player-volume input {
      width: 100px;
      cursor: pointer;
      accent-color: #1F4E23;
    }
    .recently-played {
      background: #D8F2D5;
      border-radius: 4px;
      padding: 48px;
      margin-top: 0;
    }
    .recently-played h2 {
      font-family: "Montserrat", sans-serif;
      color: #1F4E23;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .track-item {
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid rgba(31, 78, 35, 0.1);
    }
    .track-item:last-child {
      border-bottom: none;
    }
    .track-item-title {
      font-weight: 600;
      color: #231F20;
      font-size: 14px;
      margin-bottom: 3px;
    }
    .track-item-artist {
      color: #231F20;
      font-size: 13px;
      font-style: italic;
    }
    audio {
      display: none;
    }
    .loading {
      color: #231F20;
      font-style: italic;
    }
    a {
      color: #38A29D;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    @media (max-width: 768px) {
      .now-playing {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 24px;
      }
      .track-artist {
        font-size: 32px;
      }
      .album-cover {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <div class="header-logo">
        <img src="{{ url_for('static', filename='radiocalico_logo.png') }}" alt="Radio Calico Logo">
      </div>
      Radio Calico
    </h1>
  </div>

  <div class="container">
    <div class="now-playing">
      <div class="album-cover" id="albumCover">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
          <rect width="400" height="400" fill="#38A29D"/>
          <text x="200" y="200" font-size="48" fill="white" text-anchor="middle" dominant-baseline="middle">Loading...</text>
        </svg>
      </div>
      <div class="track-info">
        <div class="track-artist" id="trackArtist">Loading...</div>
        <div class="track-title" id="trackTitle"></div>
        <div class="track-album" id="trackAlbum"></div>
        <div class="track-specs" id="trackSpecs"></div>

        <div class="rating-label">Rate this track:</div>
        <div class="rating-section" id="ratingSection" style="display:none;">
          <button class="rating-button" id="thumbsUpBtn" onclick="rateTrack(true)">
            👍 <span class="rating-count" id="thumbsUpCount">0</span>
          </button>
          <button class="rating-button" id="thumbsDownBtn" onclick="rateTrack(false)">
            👎 <span class="rating-count" id="thumbsDownCount">0</span>
          </button>
        </div>

        <div class="player-wrapper">
          <button class="player-button" id="playBtn" onclick="togglePlay()">▶️</button>
          <div class="player-time"><span id="currentTime">0:00</span> / Live</div>
          <div class="player-volume">
            <span class="player-volume-icon">🔊</span>
            <input type="range" min="0" max="100" value="70" id="volumeControl" onchange="setVolume(this.value)">
          </div>
        </div>
      </div>
    </div>

    <div class="recently-played">
      <h2>Previous tracks:</h2>
      <div id="recentlyPlayedContent" class="loading">Loading...</div>
    </div>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script>
    const STREAM_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/hls/live.m3u8';
    const METADATA_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/metadatav2.json';
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const currentTimeDisplay = document.getElementById('currentTime');
    const volumeControl = document.getElementById('volumeControl');
    const trackArtist = document.getElementById('trackArtist');
    const trackTitle = document.getElementById('trackTitle');
    const trackAlbum = document.getElementById('trackAlbum');
    const trackSpecs = document.getElementById('trackSpecs');
    const recentlyPlayedContent = document.getElementById('recentlyPlayedContent');
    const ratingSection = document.getElementById('ratingSection');
    const thumbsUpBtn = document.getElementById('thumbsUpBtn');
    const thumbsDownBtn = document.getElementById('thumbsDownBtn');
    const thumbsUpCount = document.getElementById('thumbsUpCount');
    const thumbsDownCount = document.getElementById('thumbsDownCount');

    let currentSongId = null;
    let isPlaying = false;

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        playBtn.textContent = '▶️';
      } else {
        audio.play();
        playBtn.textContent = '⏸️';
      }
      isPlaying = !isPlaying;
    }

    function setVolume(value) {
      audio.volume = value / 100;
    }

    function updateTimeDisplay() {
      if (audio.currentTime) {
        const minutes = Math.floor(audio.currentTime / 60);
        const seconds = Math.floor(audio.currentTime % 60);
        currentTimeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
      }
    }

    function initStream() {
      if (Hls.isSupported()) {
        const hls = new Hls({
          autoStartLoad: true,
          debug: false,
          fragLoadingTimeOut: 20000,
          manifestLoadingTimeOut: 10000,
          levelLoadingTimeOut: 10000,
        });

        hls.loadSource(STREAM_URL);
        hls.attachMedia(audio);

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.error('HLS fatal error:', data.type);
            hls.destroy();
          }
        });
      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        audio.src = STREAM_URL;
      }
    }

    function hashStringToColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash = hash & hash;
      }
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue}, 70%, 60%)`;
    }

    function formatMetadata(data) {
      trackArtist.textContent = data.artist;
      trackTitle.textContent = data.title + ' (' + data.date + ')';
      trackAlbum.textContent = data.album;
      trackSpecs.innerHTML = `Source quality: ${data.bit_depth}-bit ${data.sample_rate / 1000}kHz<br>Stream quality: 48kHz FLAC / HLS Lossless`;

      const color1 = hashStringToColor(data.artist);
      const color2 = hashStringToColor(data.album);
      const albumCover = document.getElementById('albumCover');
      const shortArtist = data.artist.substring(0, 20);
      const shortAlbum = data.album.substring(0, 30);

      albumCover.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:${color1};stop-opacity:1" />
              <stop offset="100%" style="stop-color:${color2};stop-opacity:1" />
            </linearGradient>
          </defs>
          <rect width="400" height="400" fill="url(#grad)"/>
          <text x="200" y="150" font-size="32" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">${shortArtist}</text>
          <text x="200" y="250" font-size="24" fill="rgba(255,255,255,0.8)" text-anchor="middle" dominant-baseline="middle">${shortAlbum}</text>
        </svg>
      `;

      fetchSongRatings(data.title, data.artist, data.album, data.date);

      const recentTracks = [];
      for (let i = 1; i <= 5; i++) {
        const artistKey = `prev_artist_${i}`;
        const titleKey = `prev_title_${i}`;
        if (data[artistKey] && data[titleKey]) {
          recentTracks.push(`
            <div class="track-item">
              <div class="track-item-title">${data[artistKey]}: ${data[titleKey]}</div>
            </div>
          `);
        }
      }
      recentlyPlayedContent.innerHTML = recentTracks.join('');
    }

    function fetchSongRatings(title, artist, album, date) {
      const params = new URLSearchParams({
        title: title,
        artist: artist,
        album: album,
        date: date
      });

      fetch(`/api/song/current?${params}`)
        .then(response => response.json())
        .then(data => {
          currentSongId = data.id;
          thumbsUpCount.textContent = data.thumbs_up;
          thumbsDownCount.textContent = data.thumbs_down;
          ratingSection.style.display = 'flex';

          thumbsUpBtn.classList.remove('active');
          thumbsDownBtn.classList.remove('active');

          if (data.user_rating === 'up') {
            thumbsUpBtn.classList.add('active');
          } else if (data.user_rating === 'down') {
            thumbsDownBtn.classList.add('active');
          }
        })
        .catch(error => console.error('Error fetching song ratings:', error));
    }

    function rateTrack(isThumbsUp) {
      if (!currentSongId) return;

      fetch('/api/song/rate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          song_id: currentSongId,
          is_thumbs_up: isThumbsUp
        })
      })
        .then(response => response.json())
        .then(data => {
          thumbsUpCount.textContent = data.thumbs_up;
          thumbsDownCount.textContent = data.thumbs_down;
          thumbsUpBtn.classList.toggle('active', data.user_rating === 'up');
          thumbsDownBtn.classList.toggle('active', data.user_rating === 'down');
        })
        .catch(error => console.error('Error submitting rating:', error));
    }

    function fetchMetadata() {
      fetch(METADATA_URL)
        .then(response => response.json())
        .then(data => formatMetadata(data))
        .catch(error => {
          console.error('Error fetching metadata:', error);
          trackArtist.textContent = 'Unable to load';
          recentlyPlayedContent.innerHTML = '<div class="loading">Unable to load metadata</div>';
        });
    }

    audio.addEventListener('timeupdate', updateTimeDisplay);

    document.addEventListener('DOMContentLoaded', () => {
      initStream();
      fetchMetadata();
      setInterval(fetchMetadata, 10000);
      volumeControl.value = 70;
      setVolume(70);
    });
  </script>
</body>
</html>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script>

    const METADATA_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/metadatav2.json';
    const audio = document.getElementById('audioPlayer');
    const nowPlayingContent = document.getElementById('nowPlayingContent');
    const recentlyPlayedContent = document.getElementById('recentlyPlayedContent');
    const ratingSection = document.getElementById('ratingSection');
    const thumbsUpBtn = document.getElementById('thumbsUpBtn');
    const thumbsDownBtn = document.getElementById('thumbsDownBtn');
    const thumbsUpCount = document.getElementById('thumbsUpCount');
    const thumbsDownCount = document.getElementById('thumbsDownCount');

    let currentSongId = null;

      if (Hls.isSupported()) {
        const hls = new Hls({

      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {

      const nowPlaying = `
        <div class="track-title">${data.title}</div>
        <div class="track-artist">${data.artist}</div>
        <div class="track-album">${data.album} (${data.date})</div>
        <div class="track-specs">${data.bit_depth}-bit • ${data.sample_rate / 1000}kHz</div>
      `;
      nowPlayingContent.innerHTML = nowPlaying;

      fetchSongRatings(data.title, data.artist, data.album, data.date);

      const recentTracks = [];
      for (let i = 1; i <= 5; i++) {
        const artistKey = `prev_artist_${i}`;
        const titleKey = `prev_title_${i}`;
        if (data[artistKey] && data[titleKey]) {
          recentTracks.push(`
            <div class="track-item">
              <span class="track-item-number">${i}</span>
              <div class="track-item-info">
                <div class="track-item-title">${data[titleKey]}</div>
                <div class="track-item-artist">${data[artistKey]}</div>
              </div>
            </div>
          `);
        }
      }
      recentlyPlayedContent.innerHTML = recentTracks.join('');
    }

      const params = new URLSearchParams({

      fetch(`/api/song/current?${params}`)
        .then(response => response.json())
        .then(data => {
          currentSongId = data.id;

          thumbsDownCount.textContent = data.thumbs_down;
          ratingSection.style.display = 'flex';

          thumbsUpBtn.classList.remove('active');
          thumbsDownBtn.classList.remove('active');

          if (data.user_rating === 'up') {
            thumbsUpBtn.classList.add('active');
          } else if (data.user_rating === 'down') {
            thumbsDownBtn.classList.add('active');
          }
        })
        .catch(error => console.error('Error fetching song ratings:', error));
    }

    function rateTrack(isThumbsUp) {
      if (!currentSongId) return;

      fetch('/api/song/rate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          song_id: currentSongId,
          is_thumbs_up: isThumbsUp
        })
      })
        .then(response => response.json())
        .then(data => {
          thumbsUpCount.textContent = data.thumbs_up;
          thumbsDownCount.textContent = data.thumbs_down;

          thumbsUpBtn.classList.toggle('active', data.user_rating === 'up');
          thumbsDownBtn.classList.toggle('active', data.user_rating === 'down');
        })
        .catch(error => console.error('Error submitting rating:', error));
    }

    function fetchMetadata() {
      fetch(METADATA_URL)
        .then(response => response.json())
        .then(data => formatMetadata(data))
        .catch(error => {
          console.error('Error fetching metadata:', error);
          nowPlayingContent.innerHTML = '<div class="loading">Unable to load metadata</div>';
          recentlyPlayedContent.innerHTML = '<div class="loading">Unable to load metadata</div>';
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initStream();
      fetchMetadata();
      setInterval(fetchMetadata, 10000);
    });
  </script>
</body>
</html>
