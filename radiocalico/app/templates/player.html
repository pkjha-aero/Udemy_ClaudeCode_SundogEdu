<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Calico - Stream Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
      text-align: center;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
      text-align: center;
    }
    .player-wrapper {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }
    audio {
      width: 100%;
      cursor: pointer;
      height: 40px;
    }
    .now-playing {
      background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
      border: 2px solid #667eea;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      text-align: center;
    }
    .now-playing h2 {
      color: #667eea;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }
    .track-title {
      font-size: 20px;
      font-weight: 700;
      color: #333;
      margin-bottom: 5px;
    }
    .track-artist {
      font-size: 16px;
      color: #666;
      margin-bottom: 3px;
    }
    .track-album {
      font-size: 13px;
      color: #999;
      margin-bottom: 15px;
    }
    .track-specs {
      font-size: 11px;
      color: #667eea;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .rating-section {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
      display: flex;
      justify-content: center;
      gap: 25px;
      align-items: center;
    }
    .rating-button {
      background: none;
      border: 2px solid #e0e0e0;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
    }
    #thumbsUpBtn:hover {
      border-color: #22c55e;
      color: #22c55e;
    }
    #thumbsDownBtn:hover {
      border-color: #ef4444;
      color: #ef4444;
    }
    #thumbsUpBtn.active {
      background: #22c55e;
      border-color: #22c55e;
      color: white;
    }
    #thumbsDownBtn.active {
      background: #ef4444;
      border-color: #ef4444;
      color: white;
    }
    .rating-count {
      font-size: 12px;
      font-weight: 600;
      color: #999;
    }
    .rating-button.active .rating-count {
      color: white;
    }
    .recently-played {
      margin-bottom: 30px;
    }
    .recently-played h2 {
      color: #333;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f0f0;
    }
    .track-item {
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }
    .track-item:last-child {
      border-bottom: none;
    }
    .track-item-info {
      flex: 1;
    }
    .track-item-number {
      color: #ccc;
      font-weight: 600;
      margin-right: 12px;
      min-width: 20px;
    }
    .track-item-title {
      font-weight: 600;
      color: #333;
      font-size: 14px;
      margin-bottom: 3px;
    }
    .track-item-artist {
      color: #999;
      font-size: 13px;
    }
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      text-align: left;
      font-size: 12px;
      color: #666;
    }
    .info dt {
      font-weight: 600;
      color: #333;
      margin-top: 8px;
    }
    .info dd {
      margin-left: 0;
      margin-top: 2px;
    }
    .info dt:first-child {
      margin-top: 0;
    }
    a {
      color: #667eea;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .loading {
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ Radio Calico</h1>
    <p class="subtitle">HLS Live Stream Player</p>

    <div class="player-wrapper">
      <audio id="audioPlayer" controls preload="auto">
        Your browser does not support the audio element.
      </audio>
    </div>

    <div class="now-playing">
      <h2>Now Playing</h2>
      <div id="nowPlayingContent" class="loading">Loading...</div>
      <div id="ratingSection" class="rating-section" style="display:none;">
        <button class="rating-button" id="thumbsUpBtn" onclick="rateTrack(true)">
          👍 <span class="rating-count" id="thumbsUpCount">0</span>
        </button>
        <button class="rating-button" id="thumbsDownBtn" onclick="rateTrack(false)">
          👎 <span class="rating-count" id="thumbsDownCount">0</span>
        </button>
      </div>
    </div>

    <div class="recently-played">
      <h2>Recently Played</h2>
      <div id="recentlyPlayedContent" class="loading">Loading...</div>
    </div>

    <div class="info">
      <dl>
        <dt>Stream URL:</dt>
        <dd><code>https://d3d4yli4hf5...</code></dd>
        <dt>Format:</dt>
        <dd>HLS (HTTP Live Streaming) - Lossless</dd>
        <dt>Browser Support:</dt>
        <dd>Chrome, Firefox, Safari, Edge (iOS 10+, Android 6+)</dd>
      </dl>
    </div>

    <p style="margin-top: 20px; font-size: 12px; color: #999; text-align: center;">
      <a href="/">← Back to Home</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script>
    const STREAM_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/hls/live.m3u8';
    const METADATA_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/metadatav2.json';
    const audio = document.getElementById('audioPlayer');
    const nowPlayingContent = document.getElementById('nowPlayingContent');
    const recentlyPlayedContent = document.getElementById('recentlyPlayedContent');
    const ratingSection = document.getElementById('ratingSection');
    const thumbsUpBtn = document.getElementById('thumbsUpBtn');
    const thumbsDownBtn = document.getElementById('thumbsDownBtn');
    const thumbsUpCount = document.getElementById('thumbsUpCount');
    const thumbsDownCount = document.getElementById('thumbsDownCount');

    let currentSongId = null;

    function initStream() {
      if (Hls.isSupported()) {
        const hls = new Hls({
          autoStartLoad: true,
          debug: false,
          fragLoadingTimeOut: 20000,
          manifestLoadingTimeOut: 10000,
          levelLoadingTimeOut: 10000,
        });

        hls.loadSource(STREAM_URL);
        hls.attachMedia(audio);

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.error('HLS fatal error:', data.type);
            hls.destroy();
          }
        });
      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        audio.src = STREAM_URL;
      }
    }

    function formatMetadata(data) {
      const nowPlaying = `
        <div class="track-title">${data.title}</div>
        <div class="track-artist">${data.artist}</div>
        <div class="track-album">${data.album} (${data.date})</div>
        <div class="track-specs">${data.bit_depth}-bit • ${data.sample_rate / 1000}kHz</div>
      `;
      nowPlayingContent.innerHTML = nowPlaying;

      fetchSongRatings(data.title, data.artist, data.album, data.date);

      const recentTracks = [];
      for (let i = 1; i <= 5; i++) {
        const artistKey = `prev_artist_${i}`;
        const titleKey = `prev_title_${i}`;
        if (data[artistKey] && data[titleKey]) {
          recentTracks.push(`
            <div class="track-item">
              <span class="track-item-number">${i}</span>
              <div class="track-item-info">
                <div class="track-item-title">${data[titleKey]}</div>
                <div class="track-item-artist">${data[artistKey]}</div>
              </div>
            </div>
          `);
        }
      }
      recentlyPlayedContent.innerHTML = recentTracks.join('');
    }

    function fetchSongRatings(title, artist, album, date) {
      const params = new URLSearchParams({
        title: title,
        artist: artist,
        album: album,
        date: date
      });

      fetch(`/api/song/current?${params}`)
        .then(response => response.json())
        .then(data => {
          currentSongId = data.id;
          thumbsUpCount.textContent = data.thumbs_up;
          thumbsDownCount.textContent = data.thumbs_down;
          ratingSection.style.display = 'flex';

          thumbsUpBtn.classList.remove('active');
          thumbsDownBtn.classList.remove('active');

          if (data.user_rating === 'up') {
            thumbsUpBtn.classList.add('active');
          } else if (data.user_rating === 'down') {
            thumbsDownBtn.classList.add('active');
          }
        })
        .catch(error => console.error('Error fetching song ratings:', error));
    }

    function rateTrack(isThumbsUp) {
      if (!currentSongId) return;

      fetch('/api/song/rate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          song_id: currentSongId,
          is_thumbs_up: isThumbsUp
        })
      })
        .then(response => response.json())
        .then(data => {
          thumbsUpCount.textContent = data.thumbs_up;
          thumbsDownCount.textContent = data.thumbs_down;

          thumbsUpBtn.classList.toggle('active', data.user_rating === 'up');
          thumbsDownBtn.classList.toggle('active', data.user_rating === 'down');
        })
        .catch(error => console.error('Error submitting rating:', error));
    }

    function fetchMetadata() {
      fetch(METADATA_URL)
        .then(response => response.json())
        .then(data => formatMetadata(data))
        .catch(error => {
          console.error('Error fetching metadata:', error);
          nowPlayingContent.innerHTML = '<div class="loading">Unable to load metadata</div>';
          recentlyPlayedContent.innerHTML = '<div class="loading">Unable to load metadata</div>';
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initStream();
      fetchMetadata();
      setInterval(fetchMetadata, 10000);
    });
  </script>
</body>
</html>
