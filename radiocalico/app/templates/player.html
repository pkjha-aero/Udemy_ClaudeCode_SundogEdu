<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Calico - Stream Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .player-wrapper {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }
    audio {
      width: 100%;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .video-wrapper {
      display: none;
    }
    video {
      width: 100%;
      border-radius: 8px;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #5568d3;
    }
    button:active {
      transform: scale(0.98);
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      font-size: 14px;
      min-height: 20px;
    }
    .status.loading {
      background: #e3f2fd;
      color: #1976d2;
    }
    .status.playing {
      background: #e8f5e9;
      color: #388e3c;
    }
    .status.error {
      background: #ffebee;
      color: #c62828;
    }
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      text-align: left;
      font-size: 12px;
      color: #666;
    }
    .info dt {
      font-weight: 600;
      color: #333;
      margin-top: 8px;
    }
    .info dd {
      margin-left: 0;
      margin-top: 2px;
    }
    .info dt:first-child {
      margin-top: 0;
    }
    a {
      color: #667eea;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ Radio Calico</h1>
    <p class="subtitle">HLS Live Stream Player</p>

    <div class="player-wrapper">
      <audio id="audioPlayer" controls preload="auto">
        Your browser does not support the audio element.
      </audio>

      <div class="video-wrapper">
        <video id="videoPlayer" controls></video>
      </div>

      <div class="controls">
        <button onclick="playStream()">Play</button>
        <button onclick="pauseStream()">Pause</button>
        <button onclick="stopStream()">Stop</button>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="info">
      <dl>
        <dt>Stream URL:</dt>
        <dd><code>https://d3d4yli4hf5...</code></dd>
        <dt>Format:</dt>
        <dd>HLS (HTTP Live Streaming) - Lossless</dd>
        <dt>Browser Support:</dt>
        <dd>Chrome, Firefox, Safari, Edge (iOS 10+, Android 6+)</dd>
      </dl>
    </div>

    <p style="margin-top: 20px; font-size: 12px; color: #999;">
      <a href="/">← Back to Home</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script>
    const STREAM_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/hls/live.m3u8';
    const audio = document.getElementById('audioPlayer');
    const video = document.getElementById('videoPlayer');
    const statusDiv = document.getElementById('status');

    function updateStatus(message, type = 'loading') {
      statusDiv.textContent = message;
      statusDiv.className = 'status ' + type;
    }

    function playStream() {
      if (Hls.isSupported()) {
        const hls = new Hls({
          autoStartLoad: true,
          debug: false,
          fragLoadingTimeOut: 20000,
          manifestLoadingTimeOut: 10000,
          levelLoadingTimeOut: 10000,
        });

        hls.loadSource(STREAM_URL);
        hls.attachMedia(audio);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          updateStatus('▶️ Playing...', 'playing');
          audio.play().catch(() => {
            updateStatus('⚠️ Playback blocked by browser', 'error');
          });
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            updateStatus('❌ Stream error: ' + data.type, 'error');
            hls.destroy();
          }
        });

        updateStatus('⏳ Loading stream...', 'loading');
      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        audio.src = STREAM_URL;
        audio.play().catch(() => {
          updateStatus('⚠️ Playback blocked by browser', 'error');
        });
        updateStatus('▶️ Playing...', 'playing');
      } else {
        updateStatus('❌ HLS not supported in this browser', 'error');
      }
    }

    function pauseStream() {
      audio.pause();
      updateStatus('⏸️ Paused', 'loading');
    }

    function stopStream() {
      audio.pause();
      audio.currentTime = 0;
      updateStatus('⏹️ Stopped', 'loading');
    }

    // Auto-play on load (may be blocked by browser policy)
    document.addEventListener('DOMContentLoaded', () => {
      updateStatus('Ready to play', 'loading');
    });
  </script>
</body>
</html>
