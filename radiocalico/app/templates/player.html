<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Calico - Stream Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .player-wrapper {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }
    audio {
      width: 100%;
      cursor: pointer;
      height: 40px;
    }
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      text-align: left;
      font-size: 12px;
      color: #666;
    }
    .info dt {
      font-weight: 600;
      color: #333;
      margin-top: 8px;
    }
    .info dd {
      margin-left: 0;
      margin-top: 2px;
    }
    .info dt:first-child {
      margin-top: 0;
    }
    a {
      color: #667eea;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ Radio Calico</h1>
    <p class="subtitle">HLS Live Stream Player</p>

    <div class="player-wrapper">
      <audio id="audioPlayer" controls preload="auto">
        Your browser does not support the audio element.
      </audio>
    </div>

    <div class="info">
      <dl>
        <dt>Stream URL:</dt>
        <dd><code>https://d3d4yli4hf5...</code></dd>
        <dt>Format:</dt>
        <dd>HLS (HTTP Live Streaming) - Lossless</dd>
        <dt>Browser Support:</dt>
        <dd>Chrome, Firefox, Safari, Edge (iOS 10+, Android 6+)</dd>
      </dl>
    </div>

    <p style="margin-top: 20px; font-size: 12px; color: #999;">
      <a href="/">← Back to Home</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script>
    const STREAM_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/hls/live.m3u8';
    const audio = document.getElementById('audioPlayer');

    function initStream() {
      if (Hls.isSupported()) {
        const hls = new Hls({
          autoStartLoad: true,
          debug: false,
          fragLoadingTimeOut: 20000,
          manifestLoadingTimeOut: 10000,
          levelLoadingTimeOut: 10000,
        });

        hls.loadSource(STREAM_URL);
        hls.attachMedia(audio);

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.error('HLS fatal error:', data.type);
            hls.destroy();
          }
        });
      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        audio.src = STREAM_URL;
      }
    }

    document.addEventListener('DOMContentLoaded', initStream);
  </script>
</body>
</html>
