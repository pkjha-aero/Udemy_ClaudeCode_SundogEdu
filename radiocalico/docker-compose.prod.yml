services:
  postgres:
    image: postgres:16-alpine
    container_name: radiocalico-postgres
    restart: always
    environment:
      - POSTGRES_DB=radiocalico
      - POSTGRES_USER=radiocalico
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - radiocalico-db:/var/lib/postgresql/data
    networks:
      - radiocalico-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiocalico"]
      interval: 10s
      timeout: 5s
      retries: 5

  radiocalico:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: radiocalico:prod
    container_name: radiocalico-prod
    restart: always
    # NOTE: Port 5000 NOT exposed externally (internal only)
    # Nginx reverse proxy (port 80) is the ONLY external port
    # This ensures Flask is only accessible through Nginx (security best practice)
    expose:
      - "5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - DATABASE_URL=postgresql://radiocalico:${DB_PASSWORD}@postgres:5432/radiocalico
    depends_on:
      - postgres
    networks:
      - radiocalico-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: radiocalico-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - radiocalico
    networks:
      - radiocalico-network

volumes:
  radiocalico-db:
    driver: local

networks:
  radiocalico-network:
    driver: bridge
