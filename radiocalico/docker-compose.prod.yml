version: '3.9'

services:
  radiocalico:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: radiocalico:prod
    container_name: radiocalico-prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    volumes:
      - radiocalico-data:/app/instance
    networks:
      - radiocalico-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: radiocalico-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - radiocalico
    networks:
      - radiocalico-network

volumes:
  radiocalico-data:
    driver: local

networks:
  radiocalico-network:
    driver: bridge
