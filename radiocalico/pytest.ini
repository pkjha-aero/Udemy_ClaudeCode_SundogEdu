[pytest]
# Test discovery: pytest will only look for tests in the 'tests' directory
testpaths = tests

# File naming: pytest discovers test files that match test_*.py (e.g., test_api.py, test_models.py)
python_files = test_*.py

# Class naming: pytest discovers test classes that match Test* (e.g., TestUser, TestRatings)
python_classes = Test*

# Function naming: pytest discovers test functions that match test_* (e.g., test_user_creation)
python_functions = test_*

# Command-line options applied to all pytest runs:
# --strict-markers: Raises error if unknown markers are used (prevents typos)
# --tb=short: Shorter traceback format for cleaner output
# --disable-warnings: Suppresses non-critical warnings to reduce noise
addopts = --strict-markers --tb=short --disable-warnings

# Test markers for organizing and filtering tests
# Usage: pytest -m unit (run only unit tests) or pytest -m integration (run only integration tests)
markers =
    unit: Fast unit tests (no external dependencies)
    integration: Full workflow tests (may be slower)
    slow: Slow tests taking > 1 second (run separately if needed)
