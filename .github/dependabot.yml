version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/radiocalico"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "pkjha-aero"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-scope: "pip"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Add packages to ignore here if needed
      # - dependency-name: "package-name"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/radiocalico"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "pkjha-aero"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"
      prefix-scope: "docker"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 5
    reviewers:
      - "pkjha-aero"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      prefix-scope: "actions"
