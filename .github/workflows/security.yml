name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  secrets-scanning:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  python-security:
    name: Python Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit (SAST)
        run: |
          bandit -r radiocalico/app -f json -o bandit-report.json
          bandit -r radiocalico/app -f txt
        continue-on-error: true

      - name: Run Safety (Dependency vulnerabilities)
        run: |
          safety check --json > safety-report.json
          safety check
        continue-on-error: true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: safety-report
          path: safety-report.json

  dependency-check:
    name: Dependency Check (OWASP)
    runs-on: ubuntu-latest
    # Run only on schedule (nightly) - Safety provides real-time checks for PRs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          path: 'radiocalico'
          format: 'JSON'
          args: >
            --enableExperimental
            --scan radiocalico/requirements.txt
            --scan radiocalico/requirements-dev.txt

      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: reports

  docker-security:
    name: Docker Image Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build --target=dev -t radiocalico:dev ./radiocalico
          docker build --target=prod -t radiocalico:prod ./radiocalico

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'radiocalico:prod'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-prod'

      - name: Run Trivy on dev image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'radiocalico:dev'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  dockerfile-lint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: radiocalico/Dockerfile
          # DL3008: Pin versions in apt-get (allows slim base image flexibility)
          # DL3009: Delete apt-get lists (already removed in RUN command)
          ignore: DL3008,DL3009
          failure-threshold: warning

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:${{matrix.language}}"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    # Only run security-summary on PRs to avoid undefined context.issue.number
    if: github.event_name == 'pull_request'
    needs: [secrets-scanning, python-security, docker-security, dockerfile-lint, codeql-analysis]
    permissions:
      pull-requests: write

    steps:
      - name: Comment PR with security summary
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `
            ## 🔐 Security Scan Summary

            ✅ **Scans Completed:**
            - Secrets scanning (TruffleHog)
            - Python security analysis (Bandit + Safety)
            - Docker image scanning (Trivy)
            - Dockerfile linting (Hadolint)
            - Code analysis (CodeQL)

            ### Reports Available:
            - Check **Artifacts** tab for detailed reports
            - Check **Security** tab for CodeQL results
            - Trivy results uploaded to SARIF

            ### Failing Checks:
            View job details for specific issues. All security warnings must be addressed before merge.

            💡 **Note:** OWASP Dependency-Check runs nightly for comprehensive analysis.

            🔒 Generated with [Claude Code](https://claude.com/claude-code)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            })
