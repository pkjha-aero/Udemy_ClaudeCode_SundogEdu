name: Claude Code

# Interactive mode: Claude responds when someone mentions @claude in an
# issue, PR comment, review, or a newly opened issue.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (Claude Pro subscription, not API credits).
# Generate the token locally with `claude setup-token`, then add it as a
# repository secret named EXACTLY `CLAUDE_CODE_OAUTH_TOKEN`.
# See .github/CLAUDE_GITHUB_SETUP.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# Deny all permissions by default; the job below grants only what it needs.
# Required by OpenSSF Scorecard's Token-Permissions check.
permissions: {}

jobs:
  claude:
    # Skip starting a runner for events that don't mention @claude.
    # The action re-checks the trigger phrase itself before responding.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # `contents: write` is required so Claude can implement requested changes
      # and push commits. Without it Claude can only comment, which defeats the
      # purpose of the interactive workflow. Scoped to this job only.
      contents: write
      pull-requests: write   # open PRs and comment
      issues: write          # respond on issues
      id-token: write        # required for the action's GitHub App auth
      actions: read          # read CI results on PRs

    steps:
      # Actions pinned to full commit SHAs (OpenSSF Scorecard: Pinned-Dependencies).
      # Dependabot bumps these weekly via .github/dependabot.yml.
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@e63208cb983318a44e3f945e959ef894b707dcfa  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --max-turns 15
