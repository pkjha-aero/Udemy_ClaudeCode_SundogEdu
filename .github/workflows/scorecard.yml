name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scorecard:
    name: OpenSSF Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        continue-on-error: true
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: results.sarif
          category: scorecard

  scorecard-comment:
    name: Scorecard Summary Comment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard (for comment)
        id: scorecard
        uses: ossf/scorecard-action@v2.4.0
        continue-on-error: true
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR with Scorecard results
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `
            ## 📊 OpenSSF Scorecard Results

            This repository is assessed against OpenSSF's security best practices framework.

            ### What Scorecard Checks:
            ✅ Branch protection policies
            ✅ Code review practices
            ✅ Dependency update automation
            ✅ License compliance
            ✅ Maintenance status
            ✅ SAST (static analysis) usage
            ✅ Security policy presence
            ✅ Token permission restrictions
            ✅ Vulnerability disclosure
            ✅ And more...

            ### View Full Results:
            - **Security Tab** → Scorecard results with detailed scores
            - **Artifacts** → Download scorecard JSON report
            - Learn more: https://securityscorecards.dev

            💡 **Note:** Scorecard runs weekly to track improvements in security posture over time.

            🔒 Generated with [Claude Code](https://claude.com/claude-code)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            })
