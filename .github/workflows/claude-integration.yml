name: Claude Integration

on:
  pull_request:
    types: [opened, synchronize]
  issues:
    types: [opened, edited]
  workflow_dispatch:

jobs:
  code-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Run Claude code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install anthropic requests
          python3 .github/scripts/claude_code_review.py

  generate-docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.head_ref, 'docs')
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Generate docs with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -m pip install anthropic
          python3 .github/scripts/generate_docs.py

      - name: Commit generated docs
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "Claude Documentation Bot"
          git config user.email "claude-bot@example.com"
          git add radiocalico/docs/ radiocalico/README.md radiocalico/CLAUDE.md 2>/dev/null || true
          git commit -m "docs: auto-generated documentation updates" --allow-empty
          git push

  process-issues:
    name: Process GitHub Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Process issue with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install anthropic requests
          python3 .github/scripts/process_issues.py
